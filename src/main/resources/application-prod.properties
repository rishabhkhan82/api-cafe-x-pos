# ============================================
# Cafe-X POS Backend Configuration
# ============================================

# Database Configuration (Production MySQL)
spring.datasource.url=jdbc:mysql://200.141.1.134:3306/cafe_x_pos_prod?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# CORS Configuration
app.cors.allowed-origins=https://cafexpos.in,https://admin.cafexpos.in

# Razorpay Configuration (Live Mode)

# ============================================
# Email Configuration (Brevo SMTP Live Mode)
# ============================================
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from.email=cafexpos@gmail.com
app.mail.from.name=CafeX POS
app.mail.enabled=true

# ============================================
# Database Backup Configuration
# ============================================
backup.enabled=true
backup.upload-dir=uploads/backup
backup.mysqldump-path=mysqldump
backup.retention-days=30
backup.download-base-url=https://cafexpos.in/api