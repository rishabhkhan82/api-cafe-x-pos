<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscription Deactivated</title>
</head>
<body style="margin:0; padding:0; font-family: Arial, Helvetica, sans-serif; background-color:#f4f4f4;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color:#f4f4f4;">
        <tr>
            <td align="center" style="padding: 20px 0;">
                <table role="presentation" width="600" cellspacing="0" cellpadding="0" border="0" style="background-color:#ffffff; border-radius:8px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,0.1);">
                    <!-- Header -->
                    <tr>
                        <td style="background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); padding: 30px 40px; text-align:center;">
                            <h1 style="color:#ffffff; margin:0; font-size:28px; font-weight:bold;">CafeX POS</h1>
                            <p style="color:#fee2e2; margin:8px 0 0 0; font-size:14px;">Subscription Deactivated</p>
                        </td>
                    </tr>
                    <!-- Body -->
                    <tr>
                        <td style="padding: 40px;">
                            <h2 style="color:#333333; margin-top:0; font-size:22px;">Subscription deactivated</h2>
                            <p style="color:#555555; font-size:16px; line-height:1.6;">
                                Your subscription plan <strong th:text="${plan}">--</strong> for restaurant <strong th:text="${restaurant_name}">--</strong> has been deactivated.
                            </p>
                            <table role="presentation" cellspacing="0" cellpadding="0" border="0" style="margin:30px 0;">
                                <tr>
                                    <td style="background-color:#ef4444; border-radius:4px; text-align:center;">
                                        <a th:href="${'http://localhost:4200/subscriptions/renew/' + subscription_id}" style="display:inline-block; padding:14px 30px; color:#ffffff; text-decoration:none; font-size:16px; font-weight:bold;">
                                            Renew Subscription
                                        </a>
                                    </td>
                                </tr>
                            </table>
                            <p style="color:#777777; font-size:14px; line-height:1.5;">
                                Don't lose access to your valuable features. Renew now to continue using CafeX POS.
                            </p>
                        </td>
                    </tr>
                    <!-- Footer -->
                    <tr>
                        <td style="background-color:#f9f9f9; padding:20px 40px; text-align:center; border-top:1px solid #eeeeee;">
                            <p style="color:#888888; font-size:12px; margin:0;">&copy; 2026 CafeX POS. All rights reserved.</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
