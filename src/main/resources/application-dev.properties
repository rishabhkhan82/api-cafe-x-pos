# ============================================
# Cafe-X POS Backend Developement Configuration
# ============================================

# Database Configuration (Dev MySQL)
spring.datasource.url=jdbc:mysql://mysql-db-cafe-x-pos-db-cafe-x-pos.i.aivencloud.com:24532/cafe_x_pos?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true&requireSSL=true

# CORS Configuration
app.cors.allowed-origins=http://localhost:4200,http://localhost:3000,http://localhost:8080,http://localhost:9090,http://127.0.0.1:4200,http://127.0.0.1:8080,http://*

# Development Configuration
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# Razorpay Configuration (Test Mode)

# ============================================
# Email Configuration (Brevo SMTP)
# ============================================
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from.email=cafexpos@gmail.com
app.mail.from.name=CafeX POS
app.mail.enabled=true

# ============================================
# Database Backup Configuration
# ============================================
backup.enabled=true
backup.upload-dir=uploads/backup
backup.mysqldump-path=mysqldump
backup.retention-days=30
backup.download-base-url=http://localhost:8080/api